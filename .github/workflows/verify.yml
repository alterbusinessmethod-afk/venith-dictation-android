name: Verify Android candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out pinned candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Java 17 and Android SDK
        run: bash scripts/setup_ci_android.sh
      - name: Prepare verified bundled model
        run: |
          python3 scripts/prepare_model.py
          python3 scripts/prepare_test_audio.py
      - name: Compile and run regression tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --max-workers=2 :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:dependencies --configuration releaseRuntimeClasspath > build-verification.log 2>&1
      - name: Exercise native model and dark interface on emulator
        run: bash scripts/emulator_smoke.sh
      - name: Collect candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-candidate-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*unsigned.apk
            app/build/test-results/testDebugUnitTest/
            app/build/outputs/androidTest-results/
            build-verification.log
            smoke-evidence/
          if-no-files-found: error
          retention-days: 14
