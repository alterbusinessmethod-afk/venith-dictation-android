plugins {
    id "com.android.application"
}

android {
    namespace "com.voiceflowkeyboard.ime"
    compileSdk 35

    defaultConfig {
        applicationId "com.venith.dictation"
        minSdk 26
        targetSdk 35
        versionCode 10001
        versionName "1.0.0-preview.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (System.getenv('VENITH_SIGNING_STORE')) {
                storeFile file(System.getenv('VENITH_SIGNING_STORE'))
                storePassword System.getenv('VENITH_SIGNING_PASSWORD')
                keyAlias 'venith-dictation'
                keyPassword System.getenv('VENITH_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { ndk { abiFilters 'arm64-v8a', 'x86_64' } }
        release {
            debuggable false
            minifyEnabled false
            if (System.getenv('VENITH_SIGNING_STORE')) signingConfig signingConfigs.release
            ndk { abiFilters 'arm64-v8a' }
        }
    }
    androidResources { noCompress 'onnx' }
}

dependencies {
    implementation "com.alphacephei:vosk-android:0.3.75"
    implementation "com.bihe0832.android:lib-sherpa-onnx:8.5.4"
    implementation "org.apache.commons:commons-compress:1.27.1"
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
